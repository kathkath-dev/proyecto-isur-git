name: CI ISUR

on:
  push:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Mostrar archivos
        run: ls

      - name: Mensaje
        run: echo "Pipeline ejecutado correctamente"

      - name: Construir imagen Docker
        run: docker build -t mi-app .

      - name: Ejecutar contenedor
        run: docker run -d -p 8090:80 mi-app

      - name: Validar contenedor
        run: |
          sleep 3
          docker ps
          curl http://localhost:8090